services:

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - dbdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart:
      always

  celery-worker:
    build: .
    command: celery -A src.celery_app:celery_app worker --concurrency=1 --loglevel=INFO
    depends_on:
      - redis
    environment:
      REDIS_DSN: redis://:${REDIS_PASSWORD}@redis:6379/0
    env_file:
      - .env
    restart: always

  beat:
    build: .
    command: >
      celery -A src.celery_app:celery_app beat
      --loglevel=INFO
      --schedule=/data/celerybeat-schedule
    depends_on:
      - redis
    environment:
      REDIS_DSN: redis://:${REDIS_PASSWORD}@redis:6379/0
    env_file:
      - .env
    volumes:
      - beatdata:/data
    restart: always

  api:
    build: .
    command: uvicorn src.main:app --port=8001
    ports:
      - "8001:8001"
    depends_on:
      - db
      - redis
    environment:
      REDIS_DSN: redis://:${REDIS_PASSWORD}@redis:6379/0
    env_file:
      - .env
    restart: always

volumes:
  dbdata:
  redisdata:
  beatdata:
